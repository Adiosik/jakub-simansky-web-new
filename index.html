<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikona: kresba hlavy. SVG pro záložku (v tmavém motivu ho skript níž
         i src/theme-mode.ts přepnou na favicon-dark.svg), .ico pro starší
         prohlížeče, PNG pro plochu telefonu. Vše vzniklo z public/photos/hlava.png. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jakub Šimanský — kytarista, americký primitivismus</title>
    <!-- Popis a náhled pro vyhledávače a sdílení odkazů. Boti sociálních sítí
         nespouštějí JavaScript, takže musí být tady staticky. Pravidla
         a co kde upravit: docs/seo.md. Strukturovaná data (JSON-LD) sem
         doplní při buildu plugin ve vite.config.ts. -->
    <meta name="description" content="Jakub Šimanský, kytarista a banjista z Brna: fingerstyle a americký primitivismus. Desky, koncerty, kapely Šimanský Niesner a Šimanský Vaľko Podracký." />
    <link rel="canonical" href="https://jakubsimansky.com/" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://jakubsimansky.com/" />
    <meta property="og:site_name" content="Jakub Šimanský" />
    <meta property="og:title" content="Jakub Šimanský — kytarista, americký primitivismus" />
    <meta property="og:description" content="Kytarista a banjista z Brna. Fingerstyle a americký primitivismus — desky, koncerty, kapely." />
    <meta property="og:image" content="https://jakubsimansky.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Perokresba hlavy — znak webu Jakuba Šimanského" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="profile:first_name" content="Jakub" />
    <meta property="profile:last_name" content="Šimanský" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      /* Motiv nastavíme dřív, než se cokoli vykreslí — kdo si posledně zvolil
         tmavý, jinak uvidí bliknutí světlým pozadím. Bez uložené volby
         startujeme světlým; systémové nastavení záměrně neřešíme.
         Klíč i logika musí sedět se src/theme-mode.ts. */
      (function () {
        try {
          var m = localStorage.getItem('sim:motiv');
          document.documentElement.dataset.theme = m === 'dark' ? 'dark' : 'light';
          if (m === 'dark') document.getElementById('favicon').href = '/favicon-dark.svg';
        } catch (e) { /* soukromé okno — zůstane světlý */ }
      })();
    </script>
  </head>
  <body>
    <!-- Nadpis pro boty bez JavaScriptu (Bing hlásil „H1 tag missing“). Je
         skrytý stejně jako h1 v Hero; React obsah #root při startu nahradí
         svým, takže na stránce je vždy jen jeden h1. -->
    <div id="root"><h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Jakub Šimanský</h1></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Návštěvnost: Cloudflare Web Analytics (bez cookies, bez lišty se
         souhlasem). Token je veřejný, statistiky v Cloudflare → Web Analytics
         → jakubsimansky.com. Viz docs/seo.md. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "e454baee874144769bccc8c68c062768"}'></script>
  </body>
</html>
