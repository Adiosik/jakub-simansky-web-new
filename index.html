<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jakub Šimanský</title>
    <script>
      /* Motiv nastavíme dřív, než se cokoli vykreslí — jinak by uživatel
         s tmavým režimem uviděl bliknutí světlým pozadím. Klíč i logika musí
         sedět se src/theme-mode.ts. */
      (function () {
        try {
          var m = localStorage.getItem('sim:motiv');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = m;
        } catch (e) { /* soukromé okno — zůstane světlý */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
