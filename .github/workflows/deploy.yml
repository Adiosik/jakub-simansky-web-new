name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  # umožní spustit nasazení ručně z záložky Actions — hodí se, když Jakub
  # něco přidá do Sheetu a nechce čekat na noční běh
  workflow_dispatch:
  # jednou denně, ať se propíšou změny v Sheetu. Čas je v UTC, tedy 6:00
  # našeho letního času. GitHub časy nedodržuje na minutu a ve špičce běh
  # odsune — u denního stahování to nevadí.
  schedule:
    - cron: "0 4 * * *"

# oprávnění, která potřebuje actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# běží vždy jen jedno nasazení; rozdělaná se nechají doběhnout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (ne ci) — doplní nativní balíčky pro platformu CI (Linux),
      # které lockfile vytvořený na Windows nemusí obsahovat (rolldown, oxlint).
      # S `npm ci` tady nasazení padalo.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      # Stáhne koncerty ze Sheetu do src/data/generated/koncerty.json.
      # Schválně to není součást `npm run build` — místní build tak funguje
      # bez přístupu k Sheetu. Když se stažení nepovede, skript nechá na disku
      # commitnutá data a skončí v pořádku, takže nasazení běží dál; důvod
      # vypíše do protokolu tohohle kroku.
      - run: npm run data
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}

      # `npm run build` pouští i tsc, takže chyba typů shodí nasazení
      - run: npm run build

      # Pozn.: Pages se musí jednou zapnout ručně v Settings → Pages →
      # Source: GitHub Actions. Automatické zapnutí přes actions/configure-pages
      # s `enablement: true` tady selhalo — GITHUB_TOKEN na založení Pages
      # nemá právo („Resource not accessible by integration").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
